# ============================================================
# 燕子户外 · 临时「IP 直访」版 Nginx 配置（备案前先用 IP 测试）
#
# ⚠️ 你要下线「新指尖」，燕子户外直接占用 80 端口。
#    前提：先在服务器上停用新指尖的 Nginx 配置（见下方说明）。
#
# 使用：
#   sudo cp nginx-ip.conf /etc/nginx/conf.d/yanzi-outdoor.conf
#   sudo nginx -t && sudo nginx -s reload
#   浏览器访问 http://101.43.127.252
#
# ⚠️ 本文件与 nginx.conf 二选一，不要同时放进 conf.d/。
#    备案拿到域名后改用 nginx.conf（域名 + HTTPS 正式版）。
# ============================================================

upstream yanzi_proxy {
    server 127.0.0.1:8899;
}

# 接口限流（每 IP 每秒 2 个、突发上限见各 location）
limit_req_zone $binary_remote_addr zone=yanzi_api:10m rate=2r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 101.43.127.252;   # TODO 改成你的服务器公网 IP（也可写成 _ 匹配任意）

    # ===== 静态文件根目录（指向 index.html 所在的项目目录）=====
    root  /var/www/yanzi-outdoor-agent;   # TODO 改成你实际放置项目的目录
    index index.html;
    charset utf-8;

    # ===== gzip（静态 + JSON；SSE 单独关闭）=====
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # ===== 静态文件：Nginx 直接返回 =====
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }
    location = /logo.svg {
        try_files $uri =404;
        expires 7d;
    }

    # ===== 流式接口（SSE）：DeepSeek 对话透传 =====
    location = /deepseek/chat/completions {
        limit_req zone=yanzi_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://yanzi_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache     off;
        gzip            off;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
    }

    # ===== 普通数据接口（JSON，非流式）=====
    location ~ ^/(health|weather|train|tickets|cheapest)$ {
        limit_req zone=yanzi_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://yanzi_proxy;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
    }
}
