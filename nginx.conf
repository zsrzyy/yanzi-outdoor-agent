# ============================================================
# 燕子户外 · 智能客服助手  Nginx 部署配置
#
# 用途：前端静态文件(index.html / assets/ / logo.svg) 由 Nginx 直接返回，
#       数据接口由 Nginx 反代到本地代理 proxy.py (http://127.0.0.1:8899)。
#
# 放置：/etc/nginx/conf.d/yanzi-outdoor.conf
#      （或 /etc/nginx/sites-available/yanzi-outdoor 并软链到 sites-enabled/）
# 校验并生效：sudo nginx -t && sudo nginx -s reload
#
# 需要反代的接口路径清单（来自 proxy.py）：
#   GET  /health                    健康检查
#   GET  /weather                   天气（和风）
#   GET  /train                     车次时刻表（?code=G101&date=...）
#   GET  /tickets                   站站余票（?from=...&to=...&date=...）
#   GET  /cheapest                  最便宜方案（?q=...&date=...）
#   POST /deepseek/chat/completions DeepSeek 透传（SSE 流式，需特殊配置）
#   POST /chat                      旧版 DeepSeek（可选保留）
# ============================================================

upstream yanzi_proxy {
    server 127.0.0.1:8899;
    # 单实例即可；以后若加多台机器，在这里追加 server 行即可
}

# ---------- 80 端口：强制跳转 HTTPS（推荐）----------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;   # TODO 改成你的真实域名

    # 强制跳转 HTTPS（因为前端已不再持有密钥，但用户流量仍应加密）
    return 301 https://$host$request_uri;

    # 若暂时不想上 HTTPS，请删除上面那行 return，
    # 并把下面 443 块里的 location 段落整体复制到这个 server 块内
    # （同时删除 443 块里的 ssl_* 相关行）。
}

# ---------- 443 HTTPS 端口：真正对外服务 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;   # TODO 改成你的真实域名

    # ===== HTTPS 证书（占位符，务必替换成你自己的真实路径）=====
    # 免费证书推荐 Let's Encrypt：执行 `certbot --nginx -d example.com` 自动生成并配置；
    # 或使用腾讯云 / 阿里云下载的证书。
    ssl_certificate     /etc/nginx/ssl/example.com.pem;   # 证书链（fullchain.pem）
    ssl_certificate_key /etc/nginx/ssl/example.com.key;   # 私钥（privkey.key）
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ===== 静态文件根目录（指向 index.html 所在的项目目录）=====
    root  /var/www/yanzi-outdoor-agent;   # TODO 改成你实际放置项目的目录
    index index.html;
    charset utf-8;

    # ===== gzip 压缩（静态资源 + 非流式 JSON）=====
    # 注意：SSE 流式接口在下方单独 location 里 gzip off，不能压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ===== 静态文件：Nginx 直接返回 =====
    location / {
        try_files $uri $uri/ /index.html;   # 单页应用回退到首页
    }
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location = /logo.svg {
        try_files $uri =404;
        expires 7d;
    }

    # ===== 流式接口（SSE）：DeepSeek 对话透传 =====
    # 关键：必须关闭缓冲/缓存/压缩，否则流式回复会被 Nginx 攒包、前端看到的是"卡住后一次性吐出"
    location = /deepseek/chat/completions {
        proxy_pass http://yanzi_proxy;          # 不带 URI 尾巴 → 原样转发整个路径
        proxy_http_version 1.1;                 # SSE 必须走 HTTP/1.1（proxy.py 流式返回 1.1）
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # —— SSE 核心三件套 ——
        proxy_buffering off;        # 关闭响应缓冲，逐块实时转发
        proxy_cache     off;        # 关闭缓存
        gzip            off;        # 关闭 gzip，否则破坏 SSE 流

        # 长连接超时（SSE 会长时间保持连接）
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;

        # 关小代理层响应缓冲（虽已 buffering off，仍显式收窄）
        proxy_buffers      8 16k;
        proxy_buffer_size  16k;
    }

    # ===== 普通数据接口（JSON，非流式）=====
    location ~ ^/(health|weather|train|tickets|cheapest|chat)$ {
        proxy_pass http://yanzi_proxy;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
    }
}
