<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>燕子户外 · 户外助手</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23123B28'/%3E%3Cpath d='M10 44 24 22l9 13 6-8 15 17z' fill='%23FF7A00'/%3E%3C/svg%3E">
<style>
  :root{
    --green:#2E8B57;
    --green-deep:#1F6B43;
    --ink:#123B28;
    --ink-soft:#24513B;
    --orange:#FF7A00;
    --orange-deep:#E56A00;
    --orange-soft:#FFF3E8;
    --bg:#F5FAF4;
    --card:#FFFFFF;
    --line:#E2EDE3;
    --muted:#6B8A79;
    --warn-bg:#FFF6EE;
    --warn-line:#FFB980;
    --sidebar-w:270px;
    --r:16px;
    --shadow:0 10px 30px rgba(18,59,40,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  .app{display:flex;height:100vh;overflow:hidden}

  /* ===== 侧边栏 ===== */
  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;background:var(--ink);color:#E9F3EB;
    display:flex;flex-direction:column;padding:20px 16px;gap:6px;z-index:40;
    transition:transform .28s ease;
  }
  .brand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px}
  .brand-logo{width:42px;height:42px;border-radius:12px;overflow:hidden;flex-shrink:0}
  .brand-logo img{width:100%;height:100%;object-fit:cover;display:block}
  .brand-name{font-weight:900;font-size:20px;letter-spacing:2px;line-height:1.2}
  .brand-sub{font-size:11px;color:#9FC3AB;letter-spacing:3px;margin-top:2px}
  .nav-item{
    display:flex;align-items:center;gap:10px;width:100%;
    padding:10px 12px;border-radius:10px;font-size:14px;color:#D8E9DD;
    transition:background .18s,color .18s;text-align:left;
  }
  .nav-item:hover{background:rgba(255,255,255,.08)}
  .nav-item.active{background:var(--orange);color:#fff;font-weight:700}
  .nav-item svg{width:18px;height:18px;flex-shrink:0}
  .nav-item .count{margin-left:auto;font-size:12px;color:#9FC3AB}
  .nav-search{
    display:flex;align-items:center;gap:10px;padding:4px 12px;color:#8FB89D;
  }
  .nav-search svg{width:18px;height:18px;flex-shrink:0}
  .nav-search input{
    flex:1;background:transparent;border:none;outline:none;
    color:#E9F3EB;font-size:14px;padding:6px 0;
  }
  .nav-search input::placeholder{color:#7FA28E}
  .nav-sep{height:1px;background:rgba(255,255,255,.1);margin:12px 8px}
  .recent-title{font-size:12px;color:#8FB89D;padding:4px 12px 8px;letter-spacing:2px;display:flex;align-items:center;gap:6px}
  .recent-title .ttl{margin-left:auto;font-size:10px;letter-spacing:0;opacity:.6;font-weight:400}
  #recentList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;min-height:60px}
  #recentList::-webkit-scrollbar{width:4px}
  #recentList::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
  .recent-empty{
    font-size:13px;color:#7FA28E;padding:8px 12px;line-height:1.6;
    background:rgba(255,255,255,.04);border-radius:10px;margin:0 4px;
  }
  .recent-item{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:9px 12px;border-radius:10px;font-size:13px;color:#D8E9DD;
    text-align:left;transition:background .18s;
  }
  .recent-item:hover{background:rgba(255,255,255,.08)}
  .recent-item.active{background:rgba(255,255,255,.14);color:#fff}
  .recent-item svg{width:14px;height:14px;flex-shrink:0;color:#8FB89D}
  .recent-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .recent-item .recent-ttl{margin-left:auto;font-size:10px;opacity:.55;flex-shrink:0;overflow:visible;text-overflow:clip}
  .sidebar-foot{margin-top:auto;padding:10px 12px;font-size:11px;color:#7FA28E;line-height:1.6}

  /* ===== 主区 ===== */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  .topbar{
    display:flex;align-items:center;gap:12px;padding:14px 24px;
    background:rgba(245,250,244,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);flex-shrink:0;
  }
  .burger{display:none;width:38px;height:38px;border-radius:10px;align-items:center;justify-content:center;color:var(--ink)}
  .burger:hover{background:#E8F2E8}
  .burger svg{width:20px;height:20px}
  .topbar-title{font-size:16px;font-weight:700;letter-spacing:1px}
  .topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
  .model-select{
    background:var(--card);border:1px solid var(--line);color:var(--ink-soft);
    border-radius:10px;padding:8px 10px;font-size:12.5px;outline:none;cursor:pointer;max-width:180px;
  }
  .model-select:hover{border-color:var(--green)}
  .topbar-btn{
    display:flex;align-items:center;gap:8px;
    padding:8px 16px;border-radius:10px;background:var(--card);color:var(--ink);
    border:1px solid var(--line);font-size:13px;font-weight:500;transition:all .18s;
  }
  .topbar-btn:hover{border-color:var(--green);color:var(--green-deep)}
  .topbar-btn svg{width:15px;height:15px;color:var(--orange)}

  .content{flex:1;overflow-y:auto;display:flex;justify-content:center;padding:0 24px}
  .content-inner{width:100%;max-width:780px;padding:40px 0 40px}

  /* ===== 欢迎视图 ===== */
  .welcome{display:flex;flex-direction:column;align-items:center;text-align:center}
  .w-logo{
    width:92px;height:92px;border-radius:50%;overflow:hidden;
    box-shadow:var(--shadow);border:4px solid #fff;margin-bottom:20px;
    animation:fadeUp .5s ease both;
  }
  .w-logo img{width:100%;height:100%;object-fit:cover;display:block}
  .w-title{font-size:34px;font-weight:900;letter-spacing:10px;margin-left:10px;animation:fadeUp .5s .05s ease both}
  .w-lead{font-size:19px;font-weight:700;color:var(--ink-soft);margin-top:12px;animation:fadeUp .5s .1s ease both}
  .w-sub{font-size:14px;color:var(--muted);margin-top:6px;animation:fadeUp .5s .15s ease both}
  .w-scope{
    display:inline-flex;align-items:center;gap:6px;margin-top:16px;
    padding:6px 14px;border-radius:999px;background:var(--orange-soft);
    color:var(--orange-deep);font-size:12px;font-weight:700;letter-spacing:1px;
    animation:fadeUp .5s .2s ease both;
  }
  .w-scope svg{width:13px;height:13px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* 输入区 */
  .composer{
    width:100%;display:flex;align-items:center;gap:10px;
    background:var(--card);border:2px solid var(--line);border-radius:16px;
    padding:6px 6px 6px 18px;transition:border-color .2s,box-shadow .2s;
  }
  .welcome .composer{margin-top:24px;animation:fadeUp .5s .25s ease both}
  .composer:focus-within{border-color:var(--green);box-shadow:0 0 0 4px rgba(46,139,87,.12)}
  .composer input{
    flex:1;border:none;outline:none;font-size:15px;color:var(--ink);background:transparent;
    padding:10px 0;
  }
  .composer input::placeholder{color:#9BB3A4}
  .send-btn{
    width:42px;height:42px;border-radius:12px;background:var(--orange);color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:background .18s,transform .15s;
  }
  .send-btn:hover{background:var(--orange-deep)}
  .send-btn:active{transform:scale(.94)}
  .send-btn:disabled{background:#C9D6CC;cursor:not-allowed}
  .send-btn svg{width:19px;height:19px}
  .stop-btn{
    width:42px;height:42px;border-radius:12px;background:var(--card);color:var(--green-deep);flex-shrink:0;
    border:2px solid var(--green);
    display:flex;align-items:center;justify-content:center;transition:all .15s;
  }
  .stop-btn:hover{background:var(--green);color:#fff}
  .stop-btn svg{width:15px;height:15px}
  .composer-dock{
    display:none;padding:12px 24px 14px;flex-shrink:0;
    background:rgba(245,250,244,.9);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
  }
  .composer-dock .composer{max-width:780px;margin:0 auto}
  .main.chatting .composer-dock{display:block}

  /* 常见问题 */
  .faq-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px;width:100%;
    animation:fadeUp .5s .3s ease both;
  }
  .proxy-banner{
    width:100%;margin-top:18px;padding:12px 16px;border-radius:var(--r);
    background:#FFF7E8;border:1px solid #F2C879;color:#7A5314;
    font-size:13px;line-height:1.7;text-align:left;
    animation:fadeUp .4s ease both;
  }
  .proxy-banner a{color:#B4690E;font-weight:700;text-decoration:underline;cursor:pointer}
  .proxy-banner.stale{background:#FDEEEE;border-color:#E8A5A5;color:#7C2D2D}
  .proxy-banner.stale a{color:#A33}
  .faq-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 18px 14px;text-align:left;transition:all .2s;
    display:flex;flex-direction:column;gap:10px;
  }
  .faq-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#BFD9C4}
  .faq-card.faq-guide{border-color:var(--green);background:linear-gradient(135deg,#F2FAF3,#FFFFFF)}
  .faq-card.faq-guide .faq-cat{color:var(--green-deep)}
  .faq-cat{
    display:inline-flex;align-items:center;gap:5px;align-self:flex-start;
    font-size:11px;font-weight:700;color:var(--orange-deep);
    background:var(--orange-soft);padding:4px 10px;border-radius:999px;
  }
  .faq-cat svg{width:12px;height:12px}
  .faq-ext{font-size:9px;font-weight:400;background:rgba(255,255,255,.5);border-radius:4px;padding:1px 4px;margin-left:2px;opacity:.85}
  .faq-q{font-size:15px;font-weight:700;line-height:1.55;color:var(--ink)}
  .faq-go{margin-left:auto;color:var(--green);display:flex;align-items:center;gap:4px;font-size:12px;font-weight:500;opacity:.85;transition:opacity .18s}
  .faq-card:hover .faq-go{opacity:1}
  .faq-go svg{width:13px;height:13px}

  /* ===== 商品购买卡片 ===== */
  .shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:14px}
  .shop-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
  .shop-name{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.5}
  .shop-price{font-size:12px;color:var(--orange-deep);font-weight:600}
  .shop-price small{font-weight:400;color:var(--muted);font-size:10.5px}
  .shop-links{display:flex;gap:8px;margin-top:4px}
  .shop-btn{flex:1;text-align:center;text-decoration:none;font-size:12px;font-weight:600;padding:7px 0;border-radius:9px;color:#fff;transition:transform .15s,box-shadow .15s}
  .shop-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .shop-btn.tb{background:linear-gradient(135deg,#FF7A1A,#FF5000)}
  .shop-btn.jd{background:linear-gradient(135deg,#F23A3A,#D81E06)}
  .shop-add{margin-top:2px;border:none;background:var(--green);color:#fff;font-size:12px;font-weight:600;padding:7px 0;border-radius:9px;cursor:pointer;transition:transform .15s,opacity .15s}
  .shop-add:hover{opacity:.88}
  .shop-add.added{background:var(--muted);cursor:default}

  /* ===== 天气卡 ===== */
  .wx-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:6px}
  .wx-head{display:flex;flex-direction:column;gap:4px}
  .wx-title{font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
  .wx-sub{font-size:12px;color:var(--muted)}
  .wx-stats{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:12px}
  .wx-stat{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft)}
  .wx-sv{display:inline-flex;color:var(--orange)}
  .wx-sv svg{width:16px;height:16px}
  .wx-sl{line-height:1.4}
  .wx-hourly-title{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:16px 0 4px}
  .wx-chart{width:100%;overflow:hidden}
  .wx-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-top:14px}
  .wx-day{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
  .wx-d1{font-size:11px;color:var(--muted)}
  .wx-d2{font-size:12.5px;font-weight:700;color:var(--ink);margin:3px 0}
  .wx-d3{font-size:11px;color:var(--orange-deep);font-weight:600}
  .wx-d4{font-size:10.5px;color:var(--muted);margin-top:2px}

  /* ===== 行程卡 ===== */
  .trip-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:6px}
  .trip-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .trip-title{font-size:15px;font-weight:700;color:var(--ink)}
  .trip-sub{font-size:12px;color:var(--muted);margin-top:3px}
  .trip-export{display:inline-flex;align-items:center;gap:6px;border:none;background:var(--orange);color:#fff;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer;transition:opacity .18s}
  .trip-export:hover{opacity:.88}
  .trip-export svg{width:14px;height:14px}
  .trip-day{margin-top:14px;border-left:3px solid var(--green);padding-left:14px}
  .trip-day-h{font-size:13.5px;font-weight:700;color:var(--green-deep);margin-bottom:6px}
  .trip-item{display:flex;gap:10px;padding:6px 0;font-size:13px;color:var(--ink-soft);line-height:1.6}
  .trip-time{min-width:52px;color:var(--orange-deep);font-weight:600;font-variant-numeric:tabular-nums}
  .trip-note{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.6;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:10px 12px}

  /* ===== 购物车 ===== */
  .cart-float{position:fixed;right:22px;bottom:96px;z-index:60;background:var(--green);color:#fff;border:none;border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 20px rgba(18,59,40,.25);transition:transform .18s}
  .cart-float:hover{transform:translateY(-2px)}
  .cart-float svg{width:22px;height:22px}
  .cart-count{position:absolute;top:-3px;right:-3px;background:var(--orange);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .cart-panel{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:92vw;background:var(--card);z-index:70;transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
  .cart-panel.open{transform:translateX(0)}
  .cart-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
  .cart-head h3{font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
  .cart-head h3 svg{width:18px;height:18px;color:var(--green)}
  .cart-close{border:none;background:transparent;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:4px}
  .cart-body{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
  .cart-empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 10px;line-height:1.8}
  .cart-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .cart-ck{width:18px;height:18px;accent-color:var(--green);flex-shrink:0;cursor:pointer}
  .cart-info{flex:1;min-width:0}
  .cart-nm{font-size:13px;font-weight:600;color:var(--ink);line-height:1.4}
  .cart-pr{font-size:11.5px;color:var(--orange-deep);margin-top:2px}
  .cart-pr small{color:var(--muted)}
  .cart-del{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 6px;flex-shrink:0}
  .cart-del:hover{color:var(--red, #E24B4A)}
  .cart-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .cart-total{font-size:13px;color:var(--ink-soft);display:flex;justify-content:space-between}
  .cart-total b{color:var(--orange-deep);font-size:15px}
  .cart-export{width:100%;border:none;background:var(--green);color:#fff;font-size:14px;font-weight:600;padding:12px 0;border-radius:11px;cursor:pointer;transition:opacity .18s}
  .cart-export:hover{opacity:.9}
  .cart-clear{border:none;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;padding:4px}
  .cart-clear:hover{color:var(--ink)}
  .cart-mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:65;opacity:0;pointer-events:none;transition:opacity .28s}
  .cart-mask.open{opacity:1;pointer-events:auto}

  /* ===== 使用指南卡 ===== */
  .guide-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .guide-lead{font-size:13px;color:var(--ink-soft);line-height:1.7;background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .guide-sec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .guide-sec-h{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink)}
  .guide-sec-h svg{width:16px;height:16px;color:var(--green);flex-shrink:0}
  .guide-sec-d{font-size:12.5px;color:var(--muted);line-height:1.65;margin:6px 0 8px}
  .guide-try{display:flex;flex-wrap:wrap;gap:6px}
  .guide-q{border:1px dashed #BFD9C4;background:#F6FBF7;color:var(--green-deep);font-size:12px;padding:6px 10px;border-radius:8px;cursor:pointer;transition:background .15s,border-color .15s}
  .guide-q:hover{background:#EAF5EC;border-color:var(--green)}
  .guide-tip{font-size:12px;color:var(--muted);line-height:1.7;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:10px 12px;margin-top:12px}
  .guide-tip b{color:var(--orange-deep)}

  .w-foot{margin-top:26px;animation:fadeUp .5s .35s ease both}
  .disclaimer{font-size:12px;color:#8AA393;line-height:1.7}
  .catalog-link{
    margin-top:12px;display:inline-flex;align-items:center;gap:8px;
    font-size:14px;font-weight:700;color:var(--green-deep);padding:6px 4px;
    border-bottom:2px solid var(--orange);transition:opacity .18s;
  }
  .catalog-link:hover{opacity:.75}
  .catalog-link svg{width:15px;height:15px}

  /* ===== 对话视图 ===== */
  .chat{display:flex;flex-direction:column;gap:20px;padding-top:8px}
  .bubble-user{
    align-self:flex-end;max-width:78%;background:var(--green);color:#fff;
    padding:13px 18px;border-radius:18px 18px 4px 18px;font-size:15px;line-height:1.65;
    animation:fadeUp .3s ease both;
  }
  .bubble-ai{
    align-self:flex-start;max-width:100%;width:100%;background:var(--card);
    border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;
    box-shadow:var(--shadow);animation:fadeUp .3s ease both;
  }
  .ai-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .ai-avatar{width:28px;height:28px;border-radius:50%;overflow:hidden;flex-shrink:0}
  .ai-avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .ai-name{font-size:13px;font-weight:700;color:var(--ink)}
  .ai-badge{font-size:11px;color:var(--green-deep);background:#EAF4EC;padding:3px 8px;border-radius:999px;font-weight:500}
  .ai-text{font-size:15px;line-height:1.85;color:#2E4A3A}
  .ai-text p{margin:0 0 8px}
  .ai-text p:last-child{margin-bottom:0}
  .ai-text h3,.ai-text h4,.ai-text h5{color:var(--green-deep);margin:10px 0 6px;font-size:15px}
  .ai-text ul,.ai-text ol{margin:4px 0 8px;padding-left:20px}
  .ai-text li{margin-bottom:3px}
  .ai-text strong{color:var(--green-deep)}
  .ai-text code{background:#EAF4EC;color:var(--green-deep);padding:1px 6px;border-radius:5px;font-size:13px}
  .ai-text table{border-collapse:collapse;margin:8px 0;font-size:13.5px;width:100%}
  .ai-text th,.ai-text td{border:1px solid var(--line);padding:6px 10px;text-align:left}
  .ai-text th{background:#EAF4EC;color:var(--green-deep)}
  .ai-ref{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:#8AA393}
  .ai-loading{color:var(--muted)}
  .ai-loading span{display:inline-block;animation:blink 1.2s infinite}
  .ai-loading span:nth-child(2){animation-delay:.2s}
  .ai-loading span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
  .thinking{color:var(--muted);font-size:13.5px}
  .err-actions{margin-top:10px}
  .btn-retry{
    padding:6px 14px;border-radius:8px;background:var(--orange);color:#fff;
    font-size:12.5px;font-weight:600;transition:background .15s;
  }
  .btn-retry:hover{background:var(--orange-deep)}

  /* ===== 火车票结果卡片 ===== */
  .tr-title{font-size:16px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tr-title .tr-badge{font-size:11px;font-weight:700;color:var(--orange-deep);background:var(--orange-soft);padding:3px 9px;border-radius:999px}
  .tr-sub{font-size:12.5px;color:var(--muted);margin:6px 0 14px;line-height:1.7}
  .tr-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  .tr-table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
  .tr-table th{background:var(--ink);color:#fff;font-weight:600;text-align:left;padding:9px 12px;font-size:12.5px}
  .tr-table th:first-child{border-radius:11px 0 0 0}
  .tr-table th:last-child{border-radius:0 11px 0 0}
  .tr-table td{padding:9px 12px;border-bottom:1px solid var(--line);color:#2E4A3A;vertical-align:middle}
  .tr-table tbody tr:last-child td{border-bottom:none}
  .tr-table tbody tr:hover td{background:#F0F7F0}
  .tr-table .tr-code{font-weight:800;color:var(--green-deep)}
  .tr-table .tr-st{font-size:12px;color:var(--muted);white-space:normal;min-width:96px}
  .tr-table .tr-time{font-weight:700;color:var(--ink)}
  .tr-table .tr-dur{color:var(--muted);font-size:12px}
  .seat-tags{display:flex;flex-wrap:wrap;gap:5px;min-width:230px;white-space:normal}
  .seat-tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:7px;padding:3px 8px;background:#F2F6F2;color:#5A7264}
  .seat-tag b{font-weight:600;color:var(--ink-soft)}
  .seat-tag.have{background:#E7F3EA;color:var(--green-deep);font-weight:700}
  .seat-tag.hot{background:#FFF3E8;color:var(--orange-deep);font-weight:700}
  .seat-tag.none{background:#F4F5F4;color:#AEB8B1}
  .tr-note{margin-top:10px;font-size:12px;color:#8AA393;line-height:1.7}
  .tr-more{margin-top:8px;font-size:12px;color:var(--orange-deep);font-weight:700}
  .tr-err{color:#B0481A;line-height:1.8;font-size:14px}

  /* ===== 最便宜方案卡片 ===== */
  .cp-hero{border-radius:14px;padding:18px 20px;color:#fff;background:linear-gradient(135deg,#123B28,#1E5C3F);margin-bottom:14px}
  .cp-hero-top{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.9;margin-bottom:10px;flex-wrap:wrap}
  .cp-tag{background:var(--orange);color:#fff;font-weight:700;padding:3px 10px;border-radius:999px;font-size:11px}
  .cp-price{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .cp-price .rmb{font-size:19px;font-weight:800;color:#FFD2A8}
  .cp-price .num{font-size:38px;font-weight:900;color:var(--orange);line-height:1;letter-spacing:-1px}
  .cp-price .pinfo{font-size:12px;opacity:.85;margin-left:4px}
  .cp-leg{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:11px;padding:10px 13px;margin-top:8px}
  .cp-leg-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .cp-code{font-weight:800;font-size:14px;background:rgba(255,255,255,.17);padding:3px 10px;border-radius:8px;white-space:nowrap}
  .cp-stations{font-size:13.5px;font-weight:600}
  .cp-time{font-size:12.5px;opacity:.92;margin-left:auto;text-align:right;white-space:nowrap;line-height:1.7}
  .cp-seatline{font-size:12px;opacity:.9;margin-top:7px}
  .cp-seatline b{color:#FFD2A8;font-weight:700}
  .cp-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .cp-opt{font-size:12px;border-radius:8px;padding:3px 10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.17)}
  .cp-opt b{color:#FFD2A8;font-weight:700}
  .cp-transfer{display:flex;align-items:center;gap:9px;margin:8px 0 2px 13px;font-size:12.5px;color:#FFD2A8;font-weight:700}
  .cp-transfer::before{content:"";width:2px;height:15px;background:rgba(255,210,168,.55);border-radius:2px}
  .cp-sec{font-size:13.5px;font-weight:800;color:var(--ink);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
  .cp-sec::before{content:"";width:4px;height:14px;background:var(--orange);border-radius:2px}
  .cp-sec .cnt{font-size:11.5px;color:var(--muted);font-weight:500}
  .cp-tcard{border:1px solid var(--line);border-radius:11px;padding:10px 14px;margin-bottom:8px;background:#FCFEFC}
  .cp-tcard:hover{border-color:#BFD9C4}
  .cp-tc-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .cp-tc-code{font-weight:800;color:var(--green-deep)}
  .cp-tc-route{font-size:12.5px;color:var(--muted)}
  .cp-tc-price{margin-left:auto;font-weight:900;color:var(--orange-deep);font-size:15px;white-space:nowrap}
  .cp-tc-sub{font-size:12px;color:#5A7264;margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .cp-tc-sub .cp-wait{color:var(--orange-deep);font-weight:700}
  .cp-minilegs{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
  .cp-minileg{font-size:11.5px;background:#F2F7F3;border-radius:8px;padding:5px 9px;color:#2E4A3A;line-height:1.7}
  .cp-minileg b{color:var(--green-deep)}

  /* ===== 资料目录视图 ===== */
  .catalog-head{display:flex;align-items:center;gap:12px;margin-bottom:8px;animation:fadeUp .4s ease both}
  .catalog-head h2{font-size:22px;font-weight:900;letter-spacing:2px}
  .catalog-head .back{
    width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    color:var(--green-deep);border:1px solid var(--line);background:var(--card);transition:all .18s;
  }
  .catalog-head .back:hover{border-color:var(--green)}
  .catalog-head .back svg{width:16px;height:16px}
  .catalog-sub{font-size:13px;color:var(--muted);margin:0 0 20px 46px;animation:fadeUp .4s .05s ease both}
  .catalog-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .cat-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:18px;text-align:left;transition:all .2s;animation:fadeUp .4s ease both;
  }
  .cat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#BFD9C4}
  .cat-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .cat-ic{
    width:40px;height:40px;border-radius:12px;background:var(--orange-soft);color:var(--orange-deep);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .cat-ic svg{width:19px;height:19px}
  .cat-name{font-size:15px;font-weight:800;color:var(--ink)}
  .cat-desc{font-size:12px;color:var(--muted);margin-top:2px}
  .cat-sec{
    display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:10px;
    border-top:1px dashed var(--line);font-size:12px;color:var(--green-deep);font-weight:600;
  }
  .cat-sec svg{width:13px;height:13px}
  .cat-go{margin-left:auto;color:var(--orange-deep);display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700}
  .cat-go svg{width:13px;height:13px}

  /* ===== 资料详情视图 ===== */
  .detail-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;animation:fadeUp .4s ease both}
  .detail-head .back{
    width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    color:var(--green-deep);border:1px solid var(--line);background:var(--card);transition:all .18s;flex-shrink:0;
  }
  .detail-head .back:hover{border-color:var(--green)}
  .detail-head .back svg{width:16px;height:16px}
  .detail-ic{
    width:46px;height:46px;border-radius:13px;background:var(--orange-soft);color:var(--orange-deep);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .detail-ic svg{width:22px;height:22px}
  .detail-title{font-size:21px;font-weight:900;letter-spacing:1px}
  .detail-brief{font-size:13px;color:var(--muted);margin-top:3px}
  .detail-meta{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 20px 60px;
    font-size:12px;color:#8AA393;animation:fadeUp .4s .05s ease both;
  }
  .detail-meta svg{width:13px;height:13px;color:var(--orange)}

  .kb-section{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:20px 22px;margin-bottom:14px;animation:fadeUp .4s ease both;
  }
  .kb-h3{
    display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;color:var(--ink);
    margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line);
  }
  .kb-h3 .no{
    width:24px;height:24px;border-radius:8px;background:var(--ink);color:#fff;
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .kb-para{font-size:14.5px;line-height:1.85;color:#2E4A3A}
  .kb-para + .kb-list,.kb-para + .kb-steps{margin-top:12px}
  .kb-list{list-style:none;display:flex;flex-direction:column;gap:9px}
  .kb-list li{display:flex;gap:10px;font-size:14.5px;line-height:1.75;color:#2E4A3A;padding-left:4px}
  .kb-list li::before{
    content:"";flex-shrink:0;width:6px;height:6px;border-radius:50%;
    background:var(--green);margin-top:10px;
  }
  .kb-steps{list-style:none;counter-reset:kb;display:flex;flex-direction:column;gap:0}
  .kb-steps li{
    counter-increment:kb;display:flex;gap:12px;font-size:14.5px;line-height:1.75;
    color:#2E4A3A;padding:8px 4px;position:relative;
  }
  .kb-steps li::before{
    content:counter(kb);flex-shrink:0;width:24px;height:24px;border-radius:50%;
    background:var(--orange-soft);color:var(--orange-deep);font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;margin-top:2px;
  }
  .kb-steps li + li{border-top:1px dashed var(--line)}
  .kb-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}
  .kb-table th{background:var(--ink);color:#fff;font-weight:600;text-align:left;padding:10px 12px;font-size:13px}
  .kb-table th:first-child{border-radius:10px 0 0 0}
  .kb-table th:last-child{border-radius:0 10px 0 0}
  .kb-table td{padding:10px 12px;border-bottom:1px solid var(--line);color:#2E4A3A;line-height:1.6}
  .kb-table tr:last-child td{border-bottom:none}
  .kb-table tbody tr:hover td{background:#F0F7F0}
  .kb-warn{
    margin-top:12px;padding:12px 14px 12px 16px;border-radius:10px;
    background:var(--warn-bg);border-left:4px solid var(--orange);
    font-size:13.5px;line-height:1.75;color:#7A4A17;
  }
  .kb-warn b{color:var(--orange-deep)}
  .kb-tip{
    margin-top:12px;padding:12px 14px 12px 16px;border-radius:10px;
    background:#EDF6EF;border-left:4px solid var(--green);
    font-size:13.5px;line-height:1.75;color:#2E5C41;
  }
  .kb-tip b{color:var(--green-deep)}

  .detail-nav{
    display:flex;justify-content:space-between;gap:12px;margin-top:18px;
    animation:fadeUp .4s ease both;
  }
  .detail-nav button{
    flex:1;display:flex;align-items:center;gap:10px;padding:14px 16px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    font-size:13px;color:var(--ink-soft);transition:all .2s;text-align:left;
  }
  .detail-nav button:hover{border-color:var(--green);box-shadow:var(--shadow)}
  .detail-nav .next{justify-content:flex-end;text-align:right}
  .detail-nav .dir{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
  .detail-nav .name{font-weight:700;font-size:13px}
  .detail-nav svg{width:15px;height:15px;color:var(--orange);flex-shrink:0}

  /* 遮罩 */
  .mask{
    display:none;position:fixed;inset:0;background:rgba(18,59,40,.45);z-index:30;
    opacity:0;transition:opacity .25s;
  }
  .mask.show{display:block;opacity:1}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);
    background:var(--ink);color:#fff;font-size:13px;padding:11px 20px;border-radius:12px;
    opacity:0;pointer-events:none;transition:all .25s;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);
    display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast svg{width:15px;height:15px;color:var(--orange)}

  /* ===== 响应式 ===== */
  @media (max-width:900px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.25)}
    .sidebar.open{transform:none}
    .burger{display:flex}
    .faq-grid,.catalog-grid{grid-template-columns:1fr}
    .detail-meta{margin-left:0}
  }
  @media (max-width:560px){
    .content{padding:0 14px}
    .content-inner{padding:28px 0 28px}
    .w-title{font-size:27px;letter-spacing:7px}
    .w-lead{font-size:16px}
    .topbar{padding:10px 14px}
    .topbar-btn span{display:none}
    .kb-table{font-size:13px}
    .kb-table th,.kb-table td{padding:8px 8px}
    .model-select{max-width:110px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo"><img src="assets/logo.png" alt="燕子户外"></div>
      <div>
        <div class="brand-name">燕子户外</div>
        <div class="brand-sub">SWALLOW OUTDOOR</div>
      </div>
    </div>

    <button class="nav-item" id="navNew">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新对话
    </button>
    <button class="nav-item" id="navCatalog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
      资料库
      <span class="count" id="kbCount"></span>
    </button>
    <div class="nav-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="搜索对话" autocomplete="off">
    </div>

    <div class="nav-sep"></div>
    <div class="recent-title">最近对话<span class="ttl">3 天自动清理</span></div>
    <div id="recentList"></div>

    <div class="sidebar-foot">燕子户外 · 户外知识智能助手<br>资料库覆盖天气、车票、装备与安全攻略</div>
  </aside>

  <div class="mask" id="mask"></div>

  <!-- ===== 主区 ===== -->
  <main class="main" id="mainArea">
    <header class="topbar">
      <button class="burger" id="btnBurger" aria-label="打开菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="topbar-title">户外助手问答</span>
      <div class="topbar-actions">
        <select class="model-select" id="modelSelect" title="选择模型"></select>
        <button class="topbar-btn" id="btnAllData">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
          <span>全部户外资料</span>
        </button>
      </div>
    </header>

    <div class="content">
      <div class="content-inner" id="viewRoot"></div>
    </div>

    <!-- 对话模式输入区（置底） -->
    <div class="composer-dock" id="composerDock"></div>
  </main>
</div>

<!-- 输入框（唯一实例，在欢迎区与对话底栏之间移动） -->
<div class="composer" id="composer" style="display:none">
  <input id="askInput" type="text" placeholder="问活动、装备、攻略，或查火车票 / 车次…" autocomplete="off">
  <button class="send-btn" id="askSend" aria-label="发送" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
  </button>
  <button class="stop-btn" id="askStop" aria-label="停止生成" style="display:none">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
  </button>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
  <span id="toastMsg"></span>
</div>

<!-- 购物车浮层 -->
<div class="cart-mask" id="cartMask"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-head">
    <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>装备清单</h3>
    <button class="cart-close" id="cartClose" aria-label="关闭">×</button>
  </div>
  <div class="cart-body" id="cartBody"></div>
  <div class="cart-foot">
    <div class="cart-total"><span>已选 <b id="cartSel">0</b> / <span id="cartTot">0</span> 件</span><span>参考价合计 <b id="cartSum">¥0</b></span></div>
    <button class="cart-export" id="cartExport">导出装备购买清单</button>
    <button class="cart-clear" id="cartClear">清空清单</button>
  </div>
</div>
<button class="cart-float" id="cartFloat" style="display:none" aria-label="装备清单">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
  <span class="cart-count" id="cartCount" style="display:none">0</span>
</button>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script>
(function(){
'use strict';

   健康检查必须拿到真实天气数据（ok===true 且有 now/daily）才算数——
   旧版代理进程即使所有查询都报错也能返回 ok:false，不能让它蒙混过关。 */
var PROXY = 'http://127.0.0.1:8899';
var PROXY_CANDIDATES = ['http://127.0.0.1:8899', 'http://127.0.0.1:8901', 'http://127.0.0.1:8902', 'http://127.0.0.1:8903'];
var proxyResolved = false;
var _proxyLastOk = 0;   // 上次成功探测时间戳
/* 代理健康状态：ok=完整可用 / stale=旧版缺路由 / down=未启动 */
var proxyHealth = { status: 'unknown', base: PROXY };
async function resolveProxy(){
  /* 成功过一次后，3 秒内直接复用，避免每次提问都探测；失败则每次重新探测 */
  if(proxyResolved && proxyHealth.status === 'ok' && (Date.now() - _proxyLastOk) < 3000){
    return PROXY;
  }
  var stale = null;
  for(var i = 0; i < PROXY_CANDIDATES.length; i++){
    var base = PROXY_CANDIDATES[i];
    try{
      var ctl = new AbortController();
      var timer = setTimeout(function(){ ctl.abort(); }, 2500);
      var r = await fetch(base + '/health', { signal: ctl.signal });
      clearTimeout(timer);
      if(r.ok){
        var j = await r.json().catch(function(){ return null; });
        if(j && j.ok === true && j.name === 'yanzi-outdoor-proxy'){
          /* 完整可用：版本正确的代理 */
          PROXY = base;
          proxyResolved = true;
          _proxyLastOk = Date.now();
          proxyHealth = { status: 'ok', base: base, version: j.version };
          return PROXY;
        }
        /* 有响应但不是我们的 /health（旧版代理没这个路由） */
        stale = stale || base;
      }
    }catch(_e){
      /* 连接失败：该端口无代理 */
    }
  }
  proxyResolved = false;   /* 未找到可用代理，下次提问重新探测（用户可能中途启动了） */
  if(stale){
    proxyHealth = { status: 'stale', base: stale };
  } else {
    proxyHealth = { status: 'down', base: PROXY };
  }
  PROXY = stale || PROXY;
  return PROXY;
}

/* ================= 装备购物车（装备清单） ================= */
var CART_KEY = 'yanzi_cart_v1';
function loadCart(){
  try { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); }
  catch(e){ return []; }
}
function saveCart(items){
  localStorage.setItem(CART_KEY, JSON.stringify(items));
}
var cartItems = loadCart();
function cartAdd(item){
  var exists = cartItems.find(function(x){ return x.name === item.name; });
  if(exists){ return false; }
  cartItems.push({ name: item.name, price: item.price, kw: item.kw || item.name, checked: true });
  saveCart(cartItems);
  renderCart();
  return true;
}
function cartRemove(name){
  cartItems = cartItems.filter(function(x){ return x.name !== name; });
  saveCart(cartItems);
  renderCart();
}
function cartToggle(name){
  var it = cartItems.find(function(x){ return x.name === name; });
  if(it){ it.checked = !it.checked; saveCart(cartItems); renderCart(); }
}
function cartPriceRange(priceStr){
  /* 从 "¥900-1300" 或 "¥268" 提取数值区间，取中值用于合计 */
  var nums = String(priceStr || '').match(/\d+(?:\.\d+)?/g);
  if(!nums){ return 0; }
  var arr = nums.map(Number);
  var lo = Math.min.apply(null, arr), hi = Math.max.apply(null, arr);
  return (lo + hi) / 2;
}
function cartTotal(){
  var sel = cartItems.filter(function(x){ return x.checked; });
  var sum = sel.reduce(function(acc, x){ return acc + cartPriceRange(x.price); }, 0);
  return { sel: sel.length, total: cartItems.length, sum: Math.round(sum) };
}
function renderCart(){
  var body = $('cartBody');
  var floatBtn = $('cartFloat');
  var count = $('cartCount');

/* ================= 行程卡（[trip] 标签协议） ================= */
function parseTripCards(content){
  var cards = [];
  var text = String(content).replace(/\[trip\]([\s\S]*?)\[\/trip\]/g, function(_, inner){
    cards.push(inner.trim());
    return '';
  });
  text = text.replace(/\[trip\][\s\S]*$/, '');
  return { text: text.trim(), cards: cards };
}
/* 解析行程卡内部结构：
   第1行=标题（可含|副标题）；之后 [Day N] 或 [第N天] 开头的段为一天，
   天内每行 "- 时间 内容" 为一项，其余行按说明处理 */
function parseTripBody(raw){
  var lines = raw.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  var title = '行程安排', sub = '';
  var days = [];
  var cur = null;
  var titleSet = false;
  var notes = [];
  lines.forEach(function(line){
    if(!titleSet){
      titleSet = true;
      var parts = line.split('|');
      title = parts[0].trim() || '行程安排';
      if(parts[1]){ sub = parts[1].trim(); }
      return;
    }
    var dm = line.match(/^\[(?:Day\s*)?(\d+)(?:天|日)?\]\s*(.*)$/i) || line.match(/^第(\d+)天[:：]?\s*(.*)$/);
    if(dm){
      cur = { day: '第' + dm[1] + '天', title: dm[2] || '', items: [] };
      days.push(cur);
      return;
    }
    var im = line.match(/^[-•*]\s*(?:(\d{1,2}[:：]\d{2})\s*)?(.*)$/);
    if(cur && im){
      cur.items.push({ time: im[1] || '', text: im[2] });
      return;
    }
    /* 注意事项/提示类行：统一归入顶层备注 */
    if(/^(注意事项|注意|提示|提醒|风险提示|安全提示|备注|Warning|Note)/.test(line)){
      notes.push(line.replace(/^注意事项[:：]\s*/, '').replace(/^(注意|提示|提醒|风险提示|安全提示|备注)[:：]\s*/, ''));
      return;
    }
    /* 不在天内则进备注 */
    if(!cur){ notes.push(line); }
    else if(cur){ if(!cur.note){ cur.note = []; } cur.note.push(line); }
  });
  return { title: title, sub: sub, days: days, notes: notes };
}
function tripCardHtml(raw){
  var t = parseTripBody(raw);
  var html = '<div class="trip-card">'+
    '<div class="trip-head"><div><div class="trip-title">'+esc(t.title)+'</div>'+
    (t.sub ? '<div class="trip-sub">'+esc(t.sub)+'</div>' : '')+'</div>'+
    '<button class="trip-export" data-trip="'+encodeURIComponent(raw)+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>导出行程卡</button></div>';
  if(t.days.length){
    html += t.days.map(function(d){
      var items = d.items.length ? d.items.map(function(it){
        return '<div class="trip-item"><span class="trip-time">'+(it.time ? esc(it.time) : '—')+'</span><span>'+esc(it.text)+'</span></div>';
      }).join('') : '';
      return '<div class="trip-day"><div class="trip-day-h">'+esc(d.day)+(d.title ? ' · '+esc(d.title) : '')+'</div>'+items+
        (d.note ? '<div class="trip-note">'+d.note.map(esc).join('<br>')+'</div>' : '')+'</div>';
    }).join('');
  }
  if(t.notes.length){
    html += '<div class="trip-note">'+t.notes.map(esc).join('<br>')+'</div>';
  }
  html += '<div class="tr-note">行程为建议方案，出发前请结合实际天气、体力与当地管控调整；建议将行程告知家人或队友。</div>';
  html += '</div>';
  return html;
}
function tripCardsHtml(cards){
  if(!cards.length){ return ''; }
  return cards.map(tripCardHtml).join('');
}
function exportTrip(raw){
  var t = parseTripBody(raw);
  var lines = [];
  lines.push(t.title + (t.sub ? ' · ' + t.sub : ''));
  lines.push('====================================');
  t.days.forEach(function(d){
    lines.push('');
    lines.push('【' + d.day + '】' + (d.title ? ' ' + d.title : ''));
    d.items.forEach(function(it){
      lines.push((it.time ? it.time + '  ' : '  ') + it.text);
    });
    if(d.note){ d.note.forEach(function(n){ lines.push('  · ' + n); }); }
  });
  if(t.notes.length){ lines.push(''); lines.push('【注意事项】'); t.notes.forEach(function(n){ lines.push('· ' + n); }); }
  var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (t.title || '行程') + '.txt';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 100);
  toast('行程卡已导出');
}

/* ================= 会话持久化（保留 3 天，到期自动清理） ================= */
var CONV_TTL = 3 * 24 * 60 * 60 * 1000;
function loadConvs(){
  try { return JSON.parse(localStorage.getItem('yanzi_convs_v2') || '[]'); }
  catch(e){ return []; }
}
function cleanupConvs(){
  var now = Date.now();
  var n = convs.length;
  convs = convs.filter(function(c){ return now - (c.time || 0) < CONV_TTL; });
  if(convs.length !== n){ saveConvs(); }
  return n - convs.length;
}
function ttlLeft(t){
  var left = CONV_TTL - (Date.now() - (t || 0));
  if(left <= 0){ return '已过期'; }
  var h = Math.ceil(left / 3600000);
  return h >= 48 ? ('剩' + Math.floor(h / 24) + '天') : ('剩' + h + '小时');
}
function saveConvs(){
  var now = Date.now();
  convs = convs.filter(function(c){ return now - (c.time || 0) < CONV_TTL; });
  localStorage.setItem('yanzi_convs_v2', JSON.stringify(convs.slice(0, 20)));
}
function saveCurrentConv(){
  if(!history.length){ return; }
  var title = (history[0].content || '新对话').slice(0, 24);
  var idx = convs.findIndex(function(c){ return c.id === conversationId; });
  var item = { id: conversationId, title: title, msgs: history.slice(-30), time: Date.now() };
  if(idx >= 0){ convs[idx] = item; } else { convs.unshift(item); }
  convs.sort(function(a, b){ return b.time - a.time; });
  saveConvs();
  renderRecent($('searchInput').value.trim());
}
function renderRecent(filter){
  var box = $('recentList');
  box.innerHTML = '';
  var list = filter ? convs.filter(function(c){ return c.title.indexOf(filter) >= 0; }) : convs;
  if(!list.length){
    var d = document.createElement('div');
    d.className = 'recent-empty';
    d.innerHTML = filter ? '没有匹配的对话' : '还没有对话<br>问点关于户外的问题吧';
    box.appendChild(d);
    return;
  }
  list.forEach(function(c){
    var b = document.createElement('button');
    b.className = 'recent-item' + (c.id === conversationId && history.length ? ' active' : '');
    b.innerHTML = ICONS.chat + '<span>' + esc(c.title) + '</span><span class="recent-ttl">' + ttlLeft(c.time) + '</span>';
    b.title = c.title;
    b.onclick = function(){ loadConversation(c.id); };
    box.appendChild(b);
  });
}
function loadConversation(id){
  var c = convs.find(function(x){ return x.id === id; });
  if(!c || generating){ return; }
  conversationId = c.id;
  localStorage.setItem('yanzi_conv_id', conversationId);
  history = c.msgs.slice();
  lastFailedPrompt = null;
  renderChatView();
  history.forEach(function(m){
    if(m.role === 'user'){ appendUserBubble(m.content); }
    else { appendAiBubble(m.content, m.cardHtml || null, m.badge || ''); }
  });
  renderRecent($('searchInput').value.trim());
  scrollBottom();
}

/* ================= Markdown 轻量渲染（先转义，防注入） ================= */
function renderMarkdown(raw){
  var safe = String(raw).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  var lines = safe.split('\n');
  var html = '', inUl = false, inOl = false, tableBuf = [], inTable = false;
  function closeLists(){
    if(inUl){ html += '</ul>'; inUl = false; }
    if(inOl){ html += '</ol>'; inOl = false; }
  }
  function flushTable(){
    if(!inTable){ return; }
    if(tableBuf.length){
      var head = tableBuf[0];
      var body = tableBuf.slice(1);
      html += '<table><thead><tr>' + head.map(function(c){ return '<th>'+c+'</th>'; }).join('') + '</tr></thead><tbody>' +
        body.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>'+c+'</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
    }
    tableBuf = []; inTable = false;
  }
  function inline(t){
    return t.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }
  for(var i = 0; i < lines.length; i++){
    var trimmed = lines[i].trim();
    if(/^\|.*\|$/.test(trimmed)){
      var cells = trimmed.slice(1, -1).split('|').map(function(c){ return inline(c.trim()); });
      if(inTable && /^\|[\s:|-]+\|$/.test(trimmed)){ continue; }
      tableBuf.push(cells); inTable = true;
      continue;
    } else { flushTable(); }
    if(!trimmed){ closeLists(); continue; }
    var h = trimmed.match(/^(#{1,4})\s+(.*)$/);
    if(h){ closeLists(); var lv = Math.min(h[1].length + 2, 5); html += '<h'+lv+'>'+inline(h[2])+'</h'+lv+'>'; continue; }
    var ul = trimmed.match(/^[-*•]\s+(.*)$/);
    if(ul){ if(inOl){ html += '</ol>'; inOl = false; } if(!inUl){ html += '<ul>'; inUl = true; } html += '<li>'+inline(ul[1])+'</li>'; continue; }
    var ol = trimmed.match(/^\d+[.、)]\s+(.*)$/);
    if(ol){ if(inUl){ html += '</ul>'; inUl = false; } if(!inOl){ html += '<ol>'; inOl = true; } html += '<li>'+inline(ol[1])+'</li>'; continue; }
    closeLists();
    html += '<p>'+inline(trimmed)+'</p>';
  }
  closeLists(); flushTable();
  return html;
}

/* ================= DeepSeek 官方直连（流式 SSE + Function Calling） ================= */
/* 单次非流式请求：用于工具决策轮，需要拿到完整的 tool_calls */
async function dsRequestOnce(modelId, messages, tools, signal, temperature){
  var body = {
    model: modelId,
    messages: messages,
    stream: false,
    temperature: (typeof temperature === 'number') ? temperature : 0.3,
  };
  if(tools && tools.length){ body.tools = tools; body.tool_choice = 'auto'; }
  var resp = await fetch(DEEPSEEK_CONFIG.baseUrl + '/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + DEEPSEEK_CONFIG.apiKey,
    },
    body: JSON.stringify(body),
    signal: signal,
  });
  if(!resp.ok){
    var msg = 'HTTP ' + resp.status;
    try { var j = await resp.json(); msg = (j.error && j.error.message) || msg; } catch(_e){}
    var e = new Error(msg);
    e.error = { code: 'http_' + resp.status, message: msg };
    throw e;
  }
  return await resp.json();
}

/* 流式请求：用于最终组织回答 */
async function callDeepSeekOfficial(modelId, context, onDelta, signal){
  var resp = await fetch(DEEPSEEK_CONFIG.baseUrl + '/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + DEEPSEEK_CONFIG.apiKey,
    },
    body: JSON.stringify({ model: modelId, messages: context, stream: true, temperature: 0.8 }),
    signal: signal,
  });
  if(!resp.ok){
    var msg = 'HTTP ' + resp.status;
    try { var j = await resp.json(); msg = (j.error && j.error.message) || msg; } catch(_e){}
    var e = new Error(msg);
    e.error = { code: 'http_' + resp.status, message: msg };
    throw e;
  }
  var reader = resp.body.getReader();
  var decoder = new TextDecoder();
  var text = '', buf = '';
  for(;;){
    var rd = await reader.read();
    if(rd.done){ break; }
    buf += decoder.decode(rd.value, { stream: true });
    var lines = buf.split('\n');
    buf = lines.pop() || '';
    for(var i = 0; i < lines.length; i++){
      var t = lines[i].trim();
      if(t.indexOf('data:') !== 0){ continue; }
      var data = t.slice(5).trim();
      if(!data || data === '[DONE]'){ continue; }
      try{
        var chunk = JSON.parse(data);
        var delta = chunk.choices && chunk.choices[0] && chunk.choices[0].delta;
        if(delta && delta.reasoning_content && !text){ onDelta(null, true); }
        if(delta && delta.content){ text += delta.content; onDelta(delta.content, false); }
      }catch(_e2){}
    }
  }
  return text;
}

/* 流式优先、中断自动降级：用户到 DeepSeek 的连接不稳定时（bodyStreamBuffer was aborted 之类），
   流式挂了自动改用非流式一次性请求把完整答案拿回来，不让整轮白费。 */
async function callStreamOrFallback(modelId, ctx, onDelta, signal){
  var got = '';
  try{
    got = await callDeepSeekOfficial(modelId, ctx, onDelta, signal);
  }catch(e){
    if(e && e.name === 'AbortError'){ throw e; }
    var r = await dsRequestOnce(modelId, ctx, null, signal, 0.8);
    var c = (r.choices && r.choices[0] && r.choices[0].message && r.choices[0].message.content) || '';
    if(c && onDelta){ onDelta(c, false); }
    got = c;
  }
  return got;
}

/* 浏览器定位：返回 { lat, lon } */
function getUserLocation(){
  return new Promise(function(resolve, reject){
    if(!navigator.geolocation){
      reject(new Error('浏览器不支持定位'));
      return;
    }
    navigator.geolocation.getCurrentPosition(function(p){
      resolve({ lat: p.coords.latitude, lon: p.coords.longitude });
    }, function(e){
      reject(new Error('定位被拒绝或失败（' + e.code + '）'));
    }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 });
  });
}

      '<div class="wx-chart"><svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet">'+

  html += '</div>';

}

/* ================= 火车票查询（12306，经本地代理） ================= */
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function fmtDate(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

function parseAskDate(q){
  var now = new Date(), m;
  if(/大后天/.test(q)){ now.setDate(now.getDate() + 3); return fmtDate(now); }
  if(/后天/.test(q)){ now.setDate(now.getDate() + 2); return fmtDate(now); }
  if(/明天|明日/.test(q)){ now.setDate(now.getDate() + 1); return fmtDate(now); }
  if(/今天|今日/.test(q)){ return fmtDate(now); }
  if((m = q.match(/(\d{4})[-年\/.](\d{1,2})[-月\/.](\d{1,2})/))){
    return m[1] + '-' + pad2(+m[2]) + '-' + pad2(+m[3]);
  }
  if((m = q.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]/))){
    var dt = new Date(now.getFullYear(), +m[1] - 1, +m[2]);
    if(dt < now){ dt.setFullYear(now.getFullYear() + 1); }
    return fmtDate(dt);
  }
  return fmtDate(now);
}

function parsePeriod(q){
  if(/凌晨/.test(q)){ return { label: '凌晨', from: 0, to: 360 }; }
  if(/早上|早晨|上午/.test(q)){ return { label: '上午', from: 360, to: 720 }; }
  if(/中午/.test(q)){ return { label: '中午', from: 660, to: 840 }; }
  if(/下午/.test(q)){ return { label: '下午', from: 720, to: 1080 }; }
  if(/傍晚/.test(q)){ return { label: '傍晚', from: 1020, to: 1140 }; }
  if(/晚上|夜里|夜间/.test(q)){ return { label: '晚上', from: 1080, to: 1440 }; }
  return null;
}

function normDateArg(v){
  if(!v){ return null; }
  var s = String(v).trim();
  var m;
  if((m = s.match(/(\d{4})[-年\/.](\d{1,2})[-月\/.](\d{1,2})/))){
    return fixYear(m[1] + '-' + pad2(+m[2]) + '-' + pad2(+m[3]));
  }
  if((m = s.match(/^(\d{1,2})[-月\/](\d{1,2})[日号]?$/))){
    var now = new Date();
    return fmtDate(new Date(now.getFullYear(), +m[1] - 1, +m[2]));
  }
  return fixYear(parseAskDate(s));
}
/* 模型有时会把年份猜错（如当前 2026 年却填 2025），做向前校正：
   日期早于今天 2 天以上时，逐年+1 直到落在今天之后（最多 3 次）。 */
function fixYear(iso){
  if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)){ return iso; }
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var d = new Date(iso + 'T00:00:00');
  if(isNaN(d.getTime())){ return iso; }
  var guard = 0;
  while(d < today && guard < 3){
    d.setFullYear(d.getFullYear() + 1);
    guard++;
  }
  return fmtDate(d);
}
function normStationArg(v){
  if(!v){ return ''; }
  return String(v)
    .replace(/[\s　]/g, '')
    .replace(/^(?:从|由|在|去|到|往|去往|出发地|目的地|出发站?|到达站?)[:：]?/, '')
    .replace(/(?:站|市|区|县)$/, '')
    .replace(/^(?:中国)?(?:省)?/, '')
    .trim();
}
function periodToRange(v){
  if(!v){ return null; }
  return parsePeriod(String(v));
}

/* 旧版代理（缺路由）会返回 404 "not found"——统一翻译成明确的重启指引，
   避免模型把它误解成"预售期没到"之类的错误归因。 */
function fixProxyError(payload){
  if(payload && payload.ok === false && /not found/i.test(String(payload.error || ''))){
    return { ok:false, error:'本地助手版本过旧，缺少数据接口。请关闭所有旧的代理窗口，重新双击 start-proxy.bat 后再试。' };
  }
  return payload;
}

/* 工具执行器：返回 { payload, cardHtml, summary, badge } */
function isNetErr(e){
  return /Failed to fetch|NetworkError|Load failed|ERR_CONNECTION|fetch failed/i.test(String((e && e.message) || e || ''));
}
/* 带超时与自动重试的代理请求：网络错误/非JSON/上游5xx 自动重试一次；
   业务结果（哪怕 ok:false，如真无车）不重试，原样返回。 */
async function fetchProxyJson(url, tries){
  tries = tries || 2;
  var lastErr = null;
  for(var i = 0; i < tries; i++){
    try{
      var ctl = new AbortController();
      var timer = setTimeout(function(){ ctl.abort(); }, 45000);
      var r = await fetch(url, { signal: ctl.signal });
      clearTimeout(timer);
      if(r.status >= 500 && i < tries - 1){
        lastErr = new Error('代理上游错误（HTTP ' + r.status + '）');
      }else{
        var j = await r.json().catch(function(){ return null; });
        if(j){ return j; }
        lastErr = new Error('代理返回异常（HTTP ' + r.status + '）');
      }
    }catch(e){
      if(e && e.name === 'AbortError'){ lastErr = new Error('代理响应超时'); }
      else{ lastErr = e; }
    }
    if(i < tries - 1){ await new Promise(function(res){ setTimeout(res, 3000); }); }
  }
  throw lastErr;
}

      if(!wk){ return { payload: { ok:false, error:'定位失败或当前坐标附近无天气数据，请手动输入城市或景区名' } }; }
    } else {
      /* 和风 GeoAPI 对"五台山北台顶"这类带山顶后缀的长名匹配不到：
         逐级截断重试（去掉末尾 1-3 个描述性字），命中即用。 */
      var candidates = [];
      if(loc){
        candidates.push(loc);
        for(var cut = 1; cut <= 3 && loc.length - cut >= 2; cut++){ candidates.push(loc.slice(0, loc.length - cut)); }
      } else { candidates.push(''); }
      for(var ci = 0; ci < candidates.length; ci++){
        try{
          wk = await fetchWeather(candidates[ci] || null);
          usedLoc = candidates[ci];
          break;
        }catch(_we){
          /* 代理没跑：立即上报（关键修复——此前网络错误被吞，误报成"没查到该城市天气"） */
          if(isNetErr(_we)){ return { payload: { ok:false, error:'__PROXY_DOWN__' } }; }
          wk = null;
        }
      }
      if(!wk){
        return { payload: { ok:false, error:'没查到「' + (loc || '徐州') + '」的天气，请换一个更常见的城市或景区名试试' } };
      }
    }
    var wname = (wk.location && wk.location.name) || loc || '徐州';
    return {
      payload: wk,
      cardHtml: weatherCardHtml(wk),
      badge: '和风天气 · ' + wname,
      summary: wname + ' 实况 ' + wk.now.text + ' ' + wk.now.temp + '°C' + (dateHint ? '（关注：' + dateHint + '）' : ''),
      contextText: weatherContextText(wk) + (dateHint ? '\n用户关注的日期是「' + dateHint + '」，请重点解读该日预报。' : '') +
        (loc && usedLoc && usedLoc !== loc ? '\n（注：用户说的是「' + loc + '」，实际查到的是最接近的「' + usedLoc + '」，回答时请说明这一点，并提醒山区/山顶气温通常明显低于城区预报。）' : ''),
    };
  }
  return { payload: { ok:false, error:'未知工具 ' + name } };
}

/* Agent 循环：模型决策 → 执行工具 → 回传结果 → 直到模型给出最终回答 */
async function runToolLoop(modelId, context, onToolEvent, signal){
  var msgs = context.slice();
  var cards = [];
  var MAX_STEPS = 4;
  for(var step = 0; step < MAX_STEPS; step++){
    var res = await dsRequestOnce(modelId, msgs, AGENT_TOOLS, signal, 0.3);
    var choice = res.choices && res.choices[0];
    var msg = choice && choice.message;
    if(!msg){ break; }
    var calls = msg.tool_calls || [];
    if(!calls.length){
      /* 模型没调用工具：直接给出答案 */
      return { done: true, message: msg, messages: msgs, cards: cards, steps: step };
    }
    msgs.push({ role:'assistant', content: msg.content || '', tool_calls: calls });
    for(var i = 0; i < calls.length; i++){
      var call = calls[i];
      var fnName = call.function && call.function.name;
      var fnArgs = {};
      try{ fnArgs = JSON.parse((call.function && call.function.arguments) || '{}'); }catch(_pe){ fnArgs = {}; }
      if(onToolEvent){ onToolEvent('start', fnName, fnArgs); }
      var out;
      try{
        out = await runAgentTool(fnName, fnArgs);
      }catch(e){
        var isDown = /Failed to fetch|NetworkError|Load failed|ERR_CONNECTION/i.test(String((e && e.message) || e));
        out = { payload: { ok:false, error: isDown ? '__PROXY_DOWN__' : ('本地助手调用失败：' + ((e && e.message) || e)) } };
      }
      if(onToolEvent){ onToolEvent('end', fnName, fnArgs, out); }
      if(out.cardHtml){ cards.push(out.cardHtml); }
      var toolText = toolResultText(fnName, out.payload);
      if(out.contextText){ toolText += out.contextText; }
      msgs.push({ role:'tool', tool_call_id: call.id, content: toolText });
    }
  }
  /* 超过最大步数：追加一条纯总结请求（不带 tools，强制出文本） */
  var summaryMsgs = msgs.concat([{ role:'user', content:'请基于以上已获取的数据，用中文简洁总结并给出建议，不要再调用工具。' }]);
  var last = await dsRequestOnce(modelId, summaryMsgs, null, signal, 0.7);
  var lastMsg = (last.choices && last.choices[0] && last.choices[0].message) || { content:'' };
  return { done: true, message: lastMsg, messages: msgs, cards: cards, steps: MAX_STEPS };
}

function setGenerating(on){
  generating = on;
  askSend.style.display = on ? 'none' : 'flex';
  askStop.style.display = on ? 'flex' : 'none';
  askInput.disabled = on;
  updateSendState();
}
function updateSendState(){
  askSend.disabled = generating || !askInput.value.trim() || !currentModelId;
}

function explainError(err){
  var code = (err && err.error && err.error.code) || '';
  var rid = err && err.requestId ? '（ requestId: ' + err.requestId + ' ）' : '';
  if(code === 'http_401'){ return { msg:'DeepSeek API Key 无效或已过期，请到官方平台检查后更新', retryable:false }; }
  if(code === 'http_402'){ return { msg:'DeepSeek 账户余额不足，请到官方平台充值', retryable:false }; }
  if(code === 'http_429'){ return { msg:'DeepSeek 官方接口限流，请稍候几秒再试', retryable:true }; }
  if(code.indexOf('http_5') === 0){ return { msg:'DeepSeek 官方服务暂时不可用，请稍后重试', retryable:true }; }
  if(code.indexOf('http_') === 0){ return { msg:'DeepSeek 官方接口异常（' + code + '）', retryable:true }; }
  if(code.indexOf('request_') === 0){ return { msg:'请求参数有误，请换个说法再试' + rid, retryable:false }; }
  if(code.indexOf('auth_') === 0){ return { msg:'云服务凭证校验失败，请通过应用的正式访问域名打开本页面' + rid, retryable:false }; }
  if(code === 'quota_rate_limited'){ return { msg:'发送太频繁，被限流了，请稍等几秒再试' + rid, retryable:true }; }
  if(code.indexOf('quota_') === 0){ return { msg:'对话配额已用尽，请联系管理员处理' + rid, retryable:false }; }
  if(code.indexOf('gateway_') === 0 || code.indexOf('model_') === 0){ return { msg:'模型服务暂时不可用，可点击重试，或在右上角切换其他模型' + rid, retryable:true }; }
  if(err && err.name === 'AbortError'){ return { msg:'已停止生成', retryable:false }; }
  return { msg:'网络异常或浏览器跨域受限，请检查网络后重试' + rid, retryable:true };
}

async function send(text, isRetry){
  text = (text || '').trim();
  if(generating || !text || !currentModelId){ return; }
  var now = Date.now();
  if(now - lastSendTime < 1000){ toast('操作太快啦，歇一秒再发～'); return; }
  lastSendTime = now;

  if(currentView !== 'chat'){ renderChatView(); }
  lastFailedPrompt = isRetry ? lastFailedPrompt : text;
  appendUserBubble(text);
  history.push({ role:'user', content:text });
  askInput.value = '';
  updateSendState();

  setGenerating(true);
  var bubble = appendAiBubble('', '<p class="ai-loading">小燕正在思考<span>.</span><span>.</span><span>.</span></p>');
  var textEl = bubble.querySelector('.ai-text');

  var context = [{ role:'system', content: SYSTEM_PROMPT + '\n\n# 今天是什么日子\n当前日期是 ' + fmtDate(new Date()) + '（' + ['周日','周一','周二','周三','周四','周五','周六'][new Date().getDay()] + '）。用户说"9月25号"这类不带年份的日期时，一律用今年的年份；换算"今天/明天/后天"时以这个日期为基准。' }];
  context = context.concat(history.slice(-16, -1).map(function(m){ return { role: m.role, content: m.content }; }));
  context.push({ role:'user', content: text });

  abortController = new AbortController();
  var isOfficial = currentModelId.indexOf('official:') === 0;

  function isModelDown(e){
    var c = (e && e.error && e.error.code) || '';
    return c.indexOf('model_') === 0 || c.indexOf('gateway_') === 0;
  }
  var autoModel = models.find(function(m){ return m.id === 'auto' && m.disabled !== true; });

  /* ---------- 官方直连：Agent 工具调用 → 流式总结 ---------- */
  var toolCards = [];
  var toolSummary = '';
  var toolBadge = '';
  var toolError = '';
  var usedTools = [];
  var officialModel = currentModelId.slice('official:'.length);

  async function attemptOfficial(){
    textEl.innerHTML = '<p class="ai-loading">小燕正在理解你的问题<span>.</span><span>.</span><span>.</span></p>';
    var plainBuf = '';
    var loop = null;
    await resolveProxy();
    try{
      loop = await runToolLoop(officialModel, context, function(phase, name, args, out){
        if(phase === 'start'){
          var label = { query_trains:'正在查询 12306 车次与余票', query_train_detail:'正在查询 12306 列车时刻', query_cheapest:'正在比价 12306 实时票价', query_weather:'正在查询和风天气实时数据' }[name] || ('正在调用 ' + name);
          textEl.innerHTML = '<p class="ai-loading">' + esc(label) + '<span>.</span><span>.</span><span>.</span></p>';
        }else if(phase === 'end'){
          usedTools.push(name);
          if(out && out.badge){ toolBadge = out.badge; }
          if(out && out.summary){ toolSummary = toolSummary ? (toolSummary + '；' + out.summary) : out.summary; }
          if(out && out.cardHtml){ toolCards.push(out.cardHtml); }
          if(out && out.payload && out.payload.ok === false){
            var em = out.payload.error || '';
            toolError = (em === '__PROXY_DOWN__') ? proxyDownHtml() : ('<p class="tr-err">' + esc(em) + '</p>');
          }
        }
      }, abortController.signal);
    }catch(err){
      if(err && err.name === 'AbortError'){ throw err; }
      /* 工具链路整体不可用（模型不支持 tools / Key 异常等）→ 退回普通流式对话 */
      var retryCtx = context.slice();
      if(toolError || true){
        retryCtx.push({ role:'user', content:'（系统提示：本地实时数据工具暂时不可用，请不要编造实时车次或天气数据，可用你已有的户外知识回答，并提醒我启动本地数据代理以获取实时信息。）' });
      }
      return await callStreamOrFallback(officialModel, retryCtx, function(delta, isReasoning){
        if(isReasoning && !plainBuf){ textEl.innerHTML = '<span class="thinking">💭 小燕正在思考…</span>'; }
        if(delta){ plainBuf += delta; textEl.innerHTML = renderAnswer(plainBuf) + toolCards.join(''); scrollBottom(); }
      }, abortController.signal);
    }

    /* 已取到数据卡片：先铺卡片，再把模型给出的文字流式接上 */
    if(toolCards.length){
      textEl.innerHTML = toolCards.join('');
      scrollBottom();
    }
    var finalText = (loop && loop.message && loop.message.content) || '';
    var summaryCtx = (loop && loop.messages) ? loop.messages : context;
    if(finalText){
      /* 决策轮里模型已带出文字：直接展示，剩下的交给流式补充 */
      plainBuf = finalText;
      textEl.innerHTML = renderAnswer(plainBuf) + toolCards.join('');
      scrollBottom();
    }
    if(loop && loop.steps === 0){
      /* 模型第一轮就选择了直接回答（没调工具）：视为普通对话已完成 */
      return plainBuf;
    }
    /* 有工具数据 → 让模型基于真实数据流式总结 */
    if(toolCards.length || usedTools.length){
      var tmp = '';
      var tail = await callStreamOrFallback(officialModel, summaryCtx.concat([{ role:'user', content:'请基于上面工具返回的真实数据，用中文简洁总结关键信息并给出出行建议（不要罗列表格中已有的全部内容，不要编造数据）。' }]), function(delta, isReasoning){
        if(delta){ tmp += delta; textEl.innerHTML = (plainBuf ? renderAnswer(plainBuf) : '') + toolCards.join('') + renderAnswer(tmp); scrollBottom(); }
      }, abortController.signal);
      if(!tmp && !plainBuf){ plainBuf = toolSummary; textEl.innerHTML = toolCards.join('') + '<p>' + esc(plainBuf) + '</p>'; }
      return (plainBuf ? plainBuf + '\n' : '') + tmp;
    }
    return plainBuf;
  }

  async function attemptCloud(modelId){
    var content = '';
    var stream = cloud.llm.chat.completions.create({
      model: modelId,
      messages: context,
      stream: true,
      conversationId: conversationId,
      temperature: 0.8,
      stream_options: { include_usage: true },
      signal: abortController.signal,
    });
    for await (var chunk of stream){
      var delta = chunk.choices && chunk.choices[0] && chunk.choices[0].delta;
      if(delta && delta.content){
        content += delta.content;
        textEl.innerHTML = renderAnswer(content) + (toolCards.length ? toolCards.join('') : '');
        scrollBottom();
      }
    }
    return content;
  }

  var content = '';
  var streamError = null;
  try{
    content = isOfficial ? await attemptOfficial() : await attemptCloud(currentModelId);
  }catch(err1){
    if(!isOfficial && isModelDown(err1) && currentModelId !== 'auto' && autoModel){
      toast('所选模型暂时不可用，已自动切换 Auto 为你回复');
      try{ content = await attemptCloud(autoModel.id); }
      catch(err2){ streamError = err2; }
    }else{
      streamError = err1;
    }
  }

  abortController = null;
  setGenerating(false);

  if(streamError){
    if(toolCards.length){
      /* 已拿到真实数据但总结失败：保留卡片，不让整轮白费 */
      textEl.innerHTML = toolCards.join('') + '<p class="tr-err">数据已取到，但生成文字说明时出错：' + esc((streamError && streamError.message) || '未知错误') + '</p>';
      history.push({ role:'assistant', content: toolSummary, cardHtml: toolCards.join(''), badge: toolBadge });
      saveCurrentConv();
      scrollBottom();
      return;
    }
    bubble.remove();
    history.pop();
    var info = explainError(streamError);
    var errBubble = appendAiBubble('', '<p class="tr-err">⚠️ ' + esc(info.msg) + '</p>' + (info.retryable ? '<div class="err-actions"><button class="btn-retry">重新生成</button></div>' : ''));
    var rb = errBubble.querySelector('.btn-retry');
    if(rb){ rb.onclick = function(){ errBubble.remove(); send(lastFailedPrompt, true); }; }
    return;
  }
  if(content || toolCards.length){
    history.push({ role:'assistant', content: content || toolSummary, cardHtml: toolCards.length ? toolCards.join('') : null, badge: toolBadge || '' });
    saveCurrentConv();
  }else{
    textEl.innerHTML = '<p class="tr-err">（小燕这次没有返回内容，请重试）</p>';
  }
  scrollBottom();
}

/* 全局点击委托：处理动态渲染的「加入清单」「导出行程卡」「指南示例问句」按钮 */
document.addEventListener('click', function(e){
  var add = e.target.closest('.shop-add');
  if(add){
    var name = add.getAttribute('data-name');
    var price = add.getAttribute('data-price');
    var kw = add.getAttribute('data-kw');
    var ok = cartAdd({ name: name, price: price, kw: kw });
    if(ok){ toast('已加入装备清单'); }
    else { toast('这件已在清单里了'); }
    return;
  }
  var exp = e.target.closest('.trip-export');
  if(exp){
    var raw = decodeURIComponent(exp.getAttribute('data-trip') || '');
    if(raw){ exportTrip(raw); }
    return;
  }
  var gq = e.target.closest('.guide-q');
  if(gq){
    var q = gq.getAttribute('data-q');
    if(q){ send(q); }
    return;
  }
});

/* ================= 启动 ================= */
$('kbCount').textContent = KB.length;
initCloud();
loadModels();
renderCart();
var cleaned = cleanupConvs();
/* 每次进入都显示首页（欢迎页）；侧边栏「最近对话」保留，点击任意一条即可继续 */
conversationId = genId();
localStorage.setItem('yanzi_conv_id', conversationId);
history = [];
lastFailedPrompt = null;
renderWelcome();
if(cleaned > 0){
  toast('已自动清理 ' + cleaned + ' 个过期对话（对话保留 3 天）');
}
renderRecent('');
})();
</script>
</body>
</html>
